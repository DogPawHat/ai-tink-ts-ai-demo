app = "ai-tink-genui"
primary_region = "lhr"

[env]
ANTHROPIC_MODEL = "claude-sonnet-5-5"
COPILOTKIT_TELEMETRY_DISABLED = "true"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
grace_period = "10s"
interval = "30s"
method = "GET"
path = "/health"
timeout = "5s"

[[vm]]
size = "shared-cpu-1x"
memory = "1gb"
