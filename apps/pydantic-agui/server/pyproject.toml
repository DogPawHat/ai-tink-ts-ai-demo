[project]
name = "pydantic-agui-server"
version = "0.0.0"
description = "Pydantic AI agent served over AG-UI with FastAPI"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162", "pydantic-ai-slim[ag-ui,anthropic]>=2.61", "uvicorn>=0.54"]

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=9", "pytest-asyncio>=1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pydantic_agui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
