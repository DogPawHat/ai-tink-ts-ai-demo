app = "ai-tink-host"
primary_region = "lhr"

[env]
PORT = "8080"
PUBLIC_URL = "https://ai-tink-host.fly.dev"
GATEWAY_URL = "https://api.sprites.dev/v1/gateway/anthropic/CTHG1MvraRUcrHgF8uTjQA"
AGENT_MODEL = "claude-sonnet-5-5"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = "stop"
auto_start_machines = true
min_machines_running = 0

[http_service.concurrency]
type = "requests"
soft_limit = 25
hard_limit = 50

[[vm]]
size = "shared-cpu-1x"
memory = "512mb"
