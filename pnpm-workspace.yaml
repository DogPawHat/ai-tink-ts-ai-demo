packages:
  - apps/*

# Install-time telemetry pulled in by CopilotKit.
allowBuilds:
  "@scarf/scarf": false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.4.0
  vite-plus: 1.4.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
# @streamdown/cjk imports unified's types but only lists it as a peer, which
# pnpm doesn't link beside it, so TypeScript found whichever unified was
# hoisted (CopilotKit's 10, not 11).
packageExtensions:
  "@streamdown/cjk":
    dependencies:
      unified: ^11.0.5
